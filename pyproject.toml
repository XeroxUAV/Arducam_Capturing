[project]
name = "arducam-capturing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manny_DL", email = "manifarahy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "opencv-python>=5.0.0.93",
    # CPU-only torch: the default aarch64 wheels now pull ~3 GB of CUDA libs
    # that are useless on a Raspberry Pi. 2.9.0/0.24.0 are the newest CPU pair.
    "torch>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
    "ultralytics>=8.4.211",
]

# Note: picamera2 and libcamera are provided by Raspberry Pi OS as system
# packages (python3-picamera2, python3-libcamera) and are not installable
# from PyPI. The project venv must therefore be created with
# --system-site-packages. See README.md.

[project.scripts]
arducam-capturing = "arducam_capturing:main"

[tool.uv]
# libcamera/picamera2 only exist for the system Python on Raspberry Pi OS.
python-preference = "only-system"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
